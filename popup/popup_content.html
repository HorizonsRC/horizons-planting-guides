<!--
  Footer note for the Potential Ecosystems popup (ArcGIS Online Map Viewer).

  SETUP, in order
  ---------------
  1. Pop-ups > Title:
         {ES_Label}

  2. Pop-ups > Add content > ARCADE.
     Paste in popup_guides.arcade. Done.
     That element draws the guide images and download buttons.

     NOT "Attribute expressions" - that returns plain text, Map Viewer escapes
     the HTML, and you get an empty popup. It must be the Arcade content
     element, which sits in the same "Add content" list as Text and Image.

  3. Pop-ups > Add content > Text, positioned BELOW the Arcade element.
     Click the </> source-code button in the toolbar and paste everything
     below the divider.

  4. Delete the default "Fields list" element if Map Viewer added one,
     otherwise the raw URLs appear underneath the images.

  NOTE: Map Viewer strips <style> blocks and most CSS from popup HTML, so
  everything here and in the Arcade is inline. Keep it that way or it will be
  silently dropped.
-->

<!-- ------------------------------------------------------------------ -->

<p style="margin:12px 0 0 0; font-size:11px; color:#666; line-height:1.4;">
  Ecosystem type <b>{ES_Code}</b>, from the Singers &amp; Rogers potential
  ecosystem mapping. This shows what would most likely grow here naturally,
  not what grows here now &mdash; always check conditions on the ground
  (drainage, exposure, frost, existing shelter) before buying plants.
</p>
